opcache.enable=1
opcache.memory_consumption=512        ; 視專案大小，通常 256~512MB
opcache.max_accelerated_files=50000   ; 大型 Laravel 專案建議提高
opcache.validate_timestamps=0         ; 不檢查檔案更新
opcache.revalidate_freq=0             ; 無效，因為 validate_timestamps=0
opcache.interned_strings_buffer=16    ; 優化字串快取
opcache.fast_shutdown=1               ; 啟用快速釋放
opcache.enable_cli=0                  ; CLI 不需要快取