apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../base
  - db.yaml            # production 獨立的 MySQL + Redis
  - sealed-secret.yaml # SealedSecret 加密密碼，與 kind: Secret 強衝突
                       #   使用 Secret 則 sealed-secret.yaml 清空； 使用 sealed-secret.yaml 則 Secret 全註解掉
  - pdb.yaml           # PodDisruptionBudget，確保 node 維護時至少 1 個 replica 存活
  
# CI 會用 sed 更新此 tag：
#   sed -i "/manualsmash\/senile-app/{n;s|newTag:.*|newTag: ${TAG}|}" "${OVERLAY}/kustomization.yaml"
images:
  - name: manualsmash/senile-app
    newTag: main-2ed3b94de54d8d755fa170e147413dc0e3044426

patches:
- path: env-patch.yaml
