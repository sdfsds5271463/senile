# ConfigMap patch：注入 dev 環境變數
apiVersion: v1
kind: ConfigMap
metadata:
  name: laravel-config
data:
  APP_ENV: "local"
  APP_DEBUG: "true"
  LOG_LEVEL: "debug"
---
# Deployment patch：dev 跑 1 replica 省資源
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-app
spec:
  replicas: 1
---
# Ingress patch：dev 使用 dev.laravel.local
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: laravel-ingress
spec:
  rules:
    - host: dev.laravel.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: laravel-app-service
                port:
                  number: 80
