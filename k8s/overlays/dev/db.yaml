# MySQL 初始化腳本：首次建立 DB 時建立 migration_dbuser 與 senile_dbusr
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-initdb
data:
  01-create-users.sh: |
    #!/bin/sh
    set -e
    mysql -uroot -p"${MYSQL_ROOT_PASSWORD}" <<-EOSQL
      CREATE USER IF NOT EXISTS 'migration_dbuser'@'%' IDENTIFIED BY '${MYSQL_MIGRATION_PASSWORD}';
      GRANT CREATE, ALTER, DROP, INDEX, INSERT, UPDATE, DELETE, SELECT
        ON \`${MYSQL_DATABASE}\`.* TO 'migration_dbuser'@'%';

      CREATE USER IF NOT EXISTS 'senile_dbusr'@'%' IDENTIFIED BY '${MYSQL_APP_PASSWORD}';
      GRANT INSERT, UPDATE, DELETE, SELECT
        ON \`${MYSQL_DATABASE}\`.* TO 'senile_dbusr'@'%';

      CREATE USER IF NOT EXISTS 'exporter'@'127.0.0.1' IDENTIFIED BY '${MYSQL_EXPORTER_PASSWORD}' WITH MAX_USER_CONNECTIONS 3;
      GRANT PROCESS, REPLICATION CLIENT, SELECT ON *.* TO 'exporter'@'127.0.0.1';

      FLUSH PRIVILEGES;
    EOSQL
---
# Dev MySQL（StatefulSet，資源規格較小，與 production 完全隔離）
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      terminationGracePeriodSeconds: 60
      containers:
      - name: mysql
        image: mysql:8.0
        ports:
          - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: laravel-secret
              key: DB_ROOT_PASSWORD
        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: laravel-config
              key: DB_DATABASE
        - name: MYSQL_ROOT_HOST
          value: "%"
        - name: MYSQL_MIGRATION_PASSWORD
          valueFrom:
            secretKeyRef:
              name: laravel-secret
              key: MIGRATION_DB_PASSWORD
        - name: MYSQL_APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: laravel-secret
              key: DB_PASSWORD
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
          - name: mysql-data
            mountPath: /var/lib/mysql
          - name: mysql-initdb
            mountPath: /docker-entrypoint-initdb.d
        readinessProbe:
          exec:
            command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -p$MYSQL_ROOT_PASSWORD"]
          initialDelaySeconds: 15
          periodSeconds: 5
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: 3306
          initialDelaySeconds: 60
          periodSeconds: 20
          failureThreshold: 5

      - name: mysql-exporter
        image: prom/mysqld-exporter:v0.15.1
        args:
          - --mysqld.address=127.0.0.1:3306
          - --mysqld.username=exporter
        ports:
          - containerPort: 9104
            name: metrics
        env:
          - name: MYSQLD_EXPORTER_PASSWORD
            valueFrom:
              secretKeyRef:
                name: laravel-secret
                key: MYSQL_EXPORTER_PASSWORD
        resources:
          requests:
            memory: "32Mi"
            cpu: "20m"
          limits:
            memory: "64Mi"
            cpu: "100m"
        startupProbe:
          tcpSocket:
            port: 9104
          failureThreshold: 30
          periodSeconds: 5

      volumes:
        - name: mysql-initdb
          configMap:
            name: mysql-initdb
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi        # local-path 不會真限制 PVC 大小，它只是宣告一個容量值(可做指標參考)，實際上就是整顆硬碟的目錄
            
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  clusterIP: None
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
---
# Dev Redis（資源規格較小）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
          - containerPort: 6379
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 10
          periodSeconds: 10

      - name: redis-exporter
        image: oliver006/redis_exporter:v1.66.0
        ports:
          - containerPort: 9121
            name: metrics
        env:
          - name: REDIS_ADDR
            value: "redis://127.0.0.1:6379"
        resources:
          requests:
            memory: "32Mi"
            cpu: "20m"
          limits:
            memory: "64Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
