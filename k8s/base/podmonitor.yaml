# PodMonitor：告訴 Prometheus 去 scrape laravel-app pod 上的 nginx-exporter + Laravel /metrics
# kube-prometheus-stack 會自動偵測這個 CRD
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: laravel-nginx-metrics
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: laravel-nginx
  podMetricsEndpoints:
    - port: metrics                  # nginx-exporter（port 9113）
      path: /metrics
      interval: 30s
    - port: http                     # Laravel /prometheus（nginx port 80 → php-fpm）
      path: /prometheus
      interval: 30s
---
# Redis PodMonitor
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: redis-metrics
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: redis
  podMetricsEndpoints:
    - port: metrics                  # redis-exporter（port 9121）
      path: /metrics
      interval: 30s
---
# MySQL PodMonitor
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: mysql-metrics
  labels:
    release: kube-prometheus-stack
spec:
