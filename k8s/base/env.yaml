# 共用 ConfigMap（兩條線共享的設定）
# APP_ENV / APP_DEBUG 不在此定義，由各 overlay 的 env-patch.yaml 注入
apiVersion: v1
kind: ConfigMap
metadata:
  name: laravel-config
data:
  DB_CONNECTION: "mysql"
  DB_HOST: "mysql"
  DB_PORT: "3306"
  DB_DATABASE: "senile_db"
  DB_USERNAME: "senile_dbusr"
  MIGRATION_DB_USERNAME: "migration_dbuser"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  CACHE_STORE: "redis"
  SESSION_DRIVER: "redis"
  QUEUE_CONNECTION: "redis"
  INERTIA_SSR_ENABLED: "true"
  INERTIA_SSR_URL: "http://laravel-ssr-service:13714"
  LOG_CHANNEL: "stderr"
  LOG_LEVEL: "info"
---
# Secret（base 存放預設值，overlay 可用 secretGenerator 或 patch 覆寫）
apiVersion: v1
kind: Secret
metadata:
  name: laravel-secret
type: Opaque
data:
  # echo -n 'tt123456' | base64
  DB_ROOT_PASSWORD: dHQxMjM0NTY=
  # echo -n 'app_tt123456' | base64
  DB_PASSWORD: YXBwX3R0MTIzNDU2
  # echo -n 'mig_tt123456' | base64
  MIGRATION_DB_PASSWORD: bWlnX3R0MTIzNDU2
  # echo -n 'base64:+FlzwXNXdb0MD+rl5ahcY04ttf1hHRD90zSvJAvOOE0=' | base64
  APP_KEY: YmFzZTY0OitGbHp3WE5YZGIwTUQrcmw1YWhjWTA0dHRmMWhIUkQ5MHpTdkpBdk9PRTA9
