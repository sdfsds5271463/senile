# SSR 服務
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-ssr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ssr
  template:
    metadata:
      labels:
        app: ssr
    spec:
      containers:
      - name: ssr
        image: manualsmash/senile-app:placeholder
        imagePullPolicy: Always
        command: ["php", "artisan", "inertia:start-ssr"]
        ports:
        - containerPort: 13714
        envFrom:
        - configMapRef:
            name: laravel-config
        - secretRef:
            name: laravel-secret
        livenessProbe:
          tcpSocket:
            port: 13714
          initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: laravel-ssr-service
spec:
  selector:
    app: ssr
  ports:
    - protocol: TCP
      port: 13714
      targetPort: 13714
  type: ClusterIP
---
# Queue Worker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: laravel-worker
  template:
    metadata:
      labels:
        app: laravel-worker
    spec:
      containers:
      - name: worker
        image: manualsmash/senile-app:placeholder
        imagePullPolicy: Always
        command: ["php", "artisan", "queue:work", "--verbose", "--tries=3", "--timeout=90"]
        envFrom:
        - configMapRef:
            name: laravel-config
        - secretRef:
            name: laravel-secret
---
# Scheduler（replicas 絕對不超過 1）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: laravel-scheduler
  template:
    metadata:
      labels:
        app: laravel-scheduler
    spec:
      containers:
      - name: scheduler
        image: manualsmash/senile-app:placeholder
        imagePullPolicy: Always
        command: ["sh", "-c", "while [ true ]; do php artisan schedule:run --no-interaction; sleep 60; done"]
        envFrom:
        - configMapRef:
            name: laravel-config
        - secretRef:
            name: laravel-secret
