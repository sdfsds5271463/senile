# SSR 服務
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-ssr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ssr
  template:
    metadata:
      labels:
        app: ssr
    spec:
      containers:
      - name: ssr
        image: manualsmash/senile-app:placeholder
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
        command: ["php", "artisan", "inertia:start-ssr"]
        ports:
        - containerPort: 13714
        envFrom:
        - configMapRef:
            name: laravel-config
        - secretRef:
            name: laravel-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 13714
          initialDelaySeconds: 10
        readinessProbe:
          tcpSocket:
            port: 13714
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: laravel-ssr-service
spec:
  selector:
    app: ssr
  ports:
    - protocol: TCP
      port: 13714
      targetPort: 13714
  type: ClusterIP
---
# Queue Worker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: laravel-worker
  template:
    metadata:
      labels:
        app: laravel-worker
    spec:
      # Horizon 收到 SIGTERM 會等當前 job 跑完才退出（graceful shutdown）
      # terminationGracePeriodSeconds 需大於最長 job 執行時間
      terminationGracePeriodSeconds: 120
      containers:
      - name: worker
        image: manualsmash/senile-app:placeholder
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
        command: ["php", "artisan", "horizon"]
        envFrom:
        - configMapRef:
            name: laravel-config
        - secretRef:
            name: laravel-secret
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
---
# Scheduler（replicas 絕對不超過 1）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: laravel-scheduler
  template:
    metadata:
      labels:
        app: laravel-scheduler
    spec:
      containers:
      - name: scheduler
        image: manualsmash/senile-app:placeholder
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
        command: ["sh", "-c", "while [ true ]; do php artisan schedule:run --no-interaction; sleep 60; done"]
        envFrom:
        - configMapRef:
            name: laravel-config
        - secretRef:
            name: laravel-secret
        resources:
          requests:
            memory: "64Mi"
            cpu: "20m"
          limits:
            memory: "128Mi"
            cpu: "100m"
