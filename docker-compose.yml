services:
  # --- 基礎設施 ---
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-senile_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}   # root 的密碼 (雖然你不用它登入，但它是必填項)
      MYSQL_USER: ${DB_USERNAME:-allen}  # 自訂使用者
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:alpine
    restart: always

  # --- Laravel 主程式 (FPM) ---
  # dockerfile 說明:
  #    Dockerfile        線上Build用    兩階段Build，只把編譯好的檔案拷貝，因此沒有 Node.js、node_modules，體積小、攻擊面少。
  #    Dockerfile.local  本地up開發用   單階段Build，會把 Node.js、node_modules 包進 images，所以檔案大，但是 SSR 可以直接執行。
  #       由於複雜掛載原因，docker-compose up 使用 Dockerfile 會慢很多，因此下面用 Dockerfile.local 做開發即可
  app:
    build:
      context: .
      dockerfile: Dockerfile.local
    volumes:
      #- .:/var/www  #掛載全部較慢，掛載下面僅需要的
      - ./app:/var/www/app
      - ./config:/var/www/config
      - ./routes:/var/www/routes
      - ./resources:/var/www/resources
      - ./database:/var/www/database
      - ./public:/var/www/public
      - ./tests:/var/www/tests
      - ./storage:/var/www/storage
    depends_on:
      - mysql
      - redis
    env_file: .env
    environment:
      - DB_HOST=mysql
      - REDIS_HOST=redis
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - INERTIA_SSR_URL=http://ssr:13714

  # --- Inertia SSR Server ---
  ssr:
    build:
      context: .
      dockerfile: Dockerfile.local
    volumes:
      #- .:/var/www  #掛載全部較慢，掛載下面僅需要的
      - ./config:/var/www/config
      - ./public:/var/www/public
      - ./storage:/var/www/storage
    command: php artisan inertia:start-ssr
    depends_on:
      - app
    env_file: .env
    environment:
      - DB_HOST=mysql
      - REDIS_HOST=redis
      - INERTIA_SSR_URL=http://ssr:13714

  # --- Queue Worker ---
  worker:
    build:
      context: .
      dockerfile: Dockerfile.local
    command: php artisan queue:work
    depends_on:
      - app
    env_file: .env
    environment:
      - DB_HOST=mysql
      - REDIS_HOST=redis

  # --- Scheduler ---
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.local
    command: sh -c "while [ true ]; do php artisan schedule:run --no-interaction & sleep 60; done"
    depends_on:
      - app
    env_file: .env
    environment:
      - DB_HOST=mysql
      - REDIS_HOST=redis

  # --- Nginx (作為入口點) ---
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      #- .:/var/www  #掛載全部較慢，掛載下面僅需要的
      - ./public:/var/www/public
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

volumes:
  mysql-data: